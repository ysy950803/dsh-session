name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包，不真正发布'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
